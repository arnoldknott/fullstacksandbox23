services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        ALPINE_VERSION: ${ALPINE_VERSION}
        UV_VERSION: ${UV_VERSION}
        BUN_VERSION: ${BUN_VERSION}
        OPENTOFU_VERSION: ${OPENTOFU_VERSION}
    command:
      - sh
      - -c
      - |
        if [ ! -f /root/.vscode-server/extensions/extensions.json ]; then
          rm -f /root/.vscode-server/data/Machine/.installExtensionsMarker
        fi
        exec sleep infinity
    init: true
    volumes:
      - .:/workspaces/fullStackSandbox23:cached
      - frontend-svelte-node-modules:/workspaces/fullStackSandbox23/frontend_svelte/node_modules
      - codex-data:/root/.codex
      - copilot-data:/root/.copilot
      - vscode-server-data:/root/.vscode-server/data
      - vscode-server-extensions:/root/.vscode-server/extensions
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/root/.ssh:ro

volumes:
  frontend-svelte-node-modules:
    name: fssb23-frontend-svelte-node-modules
  codex-data:
    name: fssb23-codex-data
  copilot-data:
    name: fssb23-copilot-data
  vscode-server-data:
    name: fssb23-vscode-server-data
  vscode-server-extensions:
    name: fssb23-vscode-server-extensions
