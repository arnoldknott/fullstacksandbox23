# Model Context Protocol (MCP) servers mirrored from ../.vscode/mcp.json.
# Codex cannot include that file directly; keep these entries in sync manually.

[mcp_servers.SvelteMCP]
url = "https://mcp.svelte.dev/mcp"

[mcp_servers.Context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.flyonui-mcp]
command = "npx"
args = ["-y", "flyonui-mcp"]
