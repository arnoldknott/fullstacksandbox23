[project]
name = "backend_api"
version = "0.0.1"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"

dependencies = [
    'fastapi[standard]>=0.141.1,<1',
    'pyjwt[crypto]>=2.13.0,<3',
    'requests>=2.32.3,<3',
    'uvicorn[standard]>=0.52.1,<1',
    'azure-identity>=1.19.0,<2',
    'azure-keyvault-secrets>=4.9.0,<5',
    'pydantic-settings>=2.14.2,<3',
    'httpx2>=2.9.1,<3',
    'asyncpg>=0.30.0,<1',
    'sqlmodel>=0.0.39,<0.1.0',
    'pydantic>=2.13.4,<3',
    'alembic>=1.18.5,<2',
    'redis>=8.1.0,<9',
    'msal>=1.37.0,<2',
    'python-multipart>=0.0.20,<0.1',
    'greenlet>=3.5.4,<4', # required by sqlalchemy's asyncio!
    'websockets>=17.0.1,<18',
    'python-socketio[asyncio_client]>=5.16.3,<6',
    'python-engineio[asyncio_client]>=4.13.4,<5',
    'msal-extensions>=1.2.0,<2',
    # change to celery[redis] - currently creates a version conflict, as kmbu requires redis <5.2.1
    'celery>=5.5.3,<6',
    'pydantic-extra-types>=2.11.0,<3',
    'pycountry>=26.2.16,<27',
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1,<27",
    'ruff>=0.16.1,<1',
    "isort>=8.0.1,<9",
    'pytest>=9.1.1,<10',
    'flower>=2.0.1,<3',
    "pyright[nodejs]>=1.1.411,<2",
]

[tool.isort]
profile = "black"

[tool.black]
extend-exclude = 'src/migrations/'

[tool.ruff]
line-length = 88  # Match Black's default line length
lint.select = ["E", "F", "W", "C90"]  # Customize as needed
lint.ignore = ["E501"]  # Ignore line length to avoid conflicts with Black

[tool.pyright]
exclude = [
    "src/migrations",
    "**/__pycache__",
    "**/.venv",
    ".venv",
]
